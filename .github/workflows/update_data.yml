name: NHL Daily Update

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # Iestatām Latvijas laika zonu, lai datums vienmēr sakristu ar reālo dienu
    env:
      TZ: Europe/Riga

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas beautifulsoup4 lxml; fi

      - name: Run Calendar Script
        run: python kalendars.py

      - name: Run Stats Script
        run: python nhlstats.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git status
          git add nhl_kalendars.csv nhl_sezona.csv
          git diff --quiet && git diff --cached --quiet || (git commit -m "Automated daily NHL data update" && git push)
