# NHL Daily Update: vāc NHL oficiālos datus (api-web.nhle.com) → sezonas/*.csv (arī sezonas/nhl_kalendars.csv).
# Palaiž: cron-job.org katru dienu 08:40 (Europe/Riga, caur GitHub API workflow_dispatch) + GitHub grafiks zemāk (rezerve).
# !!! cron-job.org izmanto GitHub fine-grained žetonu, kas derīgs līdz 2027-07-30 – pirms tam jāatjauno.
name: NHL Daily Update

on:
  schedule:
    # Rezerve: 08:15 UTC = 11:15 Rīgā vasaras laikā (10:15 ziemas laikā). Galvenā palaišana: cron-job.org 08:40 (Europe/Riga) caur workflow_dispatch.
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      sakums:
        description: 'Sakuma datums (ASV laiks), piem. 2026-09-29. Var atstat tuksu.'
        required: false
        default: ''
        type: string
      beigas:
        description: 'Beigu datums, piem. 2026-10-02. Var atstat tuksu.'
        required: false
        default: ''
        type: string
      atjaunot:
        description: 'Pārrakstīt arī jau esošās spēles šajā intervālā (lai papildinātu trūkstošos laukus)'
        required: false
        default: false
        type: boolean
      pedejas:
        description: 'Tikko beigušās spēles (datumi nav jānorāda): pēdējās 8h, 4h vai 2h. Ja izvēlēts, sākuma/beigu datumi netiek ņemti vērā.'
        required: false
        default: 'nē'
        type: choice
        options:
          - 'nē'
          - 'pēdējās 8h'
          - 'pēdējās 4h'
          - 'pēdējās 2h' 

concurrency:
  group: nhl-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_collector.txt

      - name: Run Calendar Script
        # ja kalendārs neielādējas, vecais fails paliek un datu atjaunināšana tik un tā turpinās (palaišanā redzams brīdinājums)
        continue-on-error: true
        run: python kalendars.py

      - name: Run Stats Script
        env:
          PEDEJAS: ${{ inputs.pedejas }}
        run: |
          case "$PEDEJAS" in
            *8h) python nhl_dati.py --vieglais --pedejas-stundas=8 ;;
            *4h) python nhl_dati.py --vieglais --pedejas-stundas=4 ;;
            *2h) python nhl_dati.py --vieglais --pedejas-stundas=2 ;;
            *)   python nhl_dati.py --vieglais ${{ inputs.sakums }} ${{ inputs.beigas }} ${{ inputs.atjaunot && '--atjaunot' || '' }} ;;
          esac

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add sezonas/
          git diff --cached --quiet || (git commit -m "Automated daily NHL data update" && git pull --rebase && git push)
