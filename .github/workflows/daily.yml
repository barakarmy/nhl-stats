name: NHL Daily Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      sakums:
        description: 'Sakuma datums (ASV laiks), piem. 2026-09-29. Var atstat tuksu.'
        required: false
        default: ''
        type: string
      beigas:
        description: 'Beigu datums, piem. 2026-10-02. Var atstat tuksu.'
        required: false
        default: ''
        type: string
      atjaunot:
        description: 'Pārrakstīt arī jau esošās spēles šajā intervālā (lai papildinātu trūkstošos laukus)'
        required: false
        default: false
        type: boolean

concurrency:
  group: nhl-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_collector.txt

      - name: Run Calendar Script
        run: python kalendars.py

      - name: Run Stats Script
        run: python nhl_dati.py --vieglais ${{ inputs.sakums }} ${{ inputs.beigas }} ${{ inputs.atjaunot && '--atjaunot' || '' }}

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add nhl_kalendars.csv dati/
          git diff --cached --quiet || (git commit -m "Automated daily NHL data update" && git pull --rebase && git push)
