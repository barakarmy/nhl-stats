name: NHL Referees (pirms spēlēm)

on:
  schedule:
    # Ātra pārbaude katras 30 minūtes no 12:00 līdz 23:30 UTC (pēc UTC, tāpēc vasaras/ziemas laiks nav svarīgs).
    # Pati ielāde notiek tikai tad, ja kādai spēlei tuvāko 4 stundu laikā vēl nav paziņoti tiesneši.
    - cron: '*/30 12-23 * * *'
  workflow_dispatch:   # ar roku: vienmēr veic ielādi un pārbauda spēles tuvāko 30 stundu laikā

concurrency:
  group: nhl-data-update
  cancel-in-progress: false

jobs:
  referees:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if referees are needed
        id: check
        # tikai standarta Python, bez pakotņu instalēšanas: nolasa nhl_kalendars.csv un dati/tiesnesi_planotie.csv
        run: python3 tiesnesi_planotie.py --parbaude

      - name: Set up Python
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_collector.txt

      - name: Fetch assigned referees
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: python tiesnesi_planotie.py ${{ github.event_name == 'workflow_dispatch' && '--stundas 30 --visas' || '' }}

      - name: Commit and push changes if any
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add dati/tiesnesi_planotie.csv
          git diff --cached --quiet || (git commit -m "Referees update" && git pull --rebase && git push)
